        }

        }

        #feedback-area {
            padding: 0 30px 30px;
            text-align: right;
        }

            font-size: 18px;
            font-weight: 700;
            height: 25px;

            { q: "The theory of consent is closely related to the writings of", o: ["Hobbes", "Locke", "Rousseau", "Bentham"], a: "b" },
            { q: "Who expounded the theory that the general will would be the source of all laws?", o: ["Rousseau", "Locke", "Hobbes", "Hegel"], a: "a" },
            { q: "Name the thinker who believed that the government is the agent of the general will", o: ["Locke", "Hobbes", "Hegel", "Rousseau"], a: "d" },
            { q: "In whose social contract man does not surrender completely to a sovereign ruler?", o: ["Locke", "Rousseau", "Hobbes", "None of these"], a: "b" },
            { q: "Who viewed hedonism not only as a principle of motivation, but also a principle of action?", o: ["Bentham", "Mill", "Hegel", "James Mill"], a: "a" },
            { q: "Name the Scholar who criticized Bentham's Pleasure pain theory as 'uninspiring and merely mechanical'", o: ["C.C.Maxey", "C.L.Wayper", "Ebenstein", "Sabine"], a: "c" },
            { q: "Identify the thinker who wrote that 'State is a moral institution with a moral end'", o: ["J.S.Mill", "Bentham", "Marx", "Hegel"], a: "a" },
            { q: "Who regarded utility as a noble sentiment associated with Christian religion?", o: ["James Mill", "Bentham", "J.S.Mill", "Hegel"], a: "c" },
            { q: "Who declared that 'Over himself, over his own body and mind, the individual is sovereign'", o: ["Bentham", "Marx", "Mao", "J.S.Mill"], a: "d" },
            { q: "Name the Scholar who holds the view that man obeys the state because he is afraid of the consequences of disobedience.", o: ["Hegel", "Green", "Marx", "Lenin"], a: "a" },
            { q: "Identify the scholar who believed that class struggle in the modern period is simpler than earlier class struggle.", o: ["Plato", "Hegel", "Marx", "Gramsci"], a: "c" },
            { q: "Marx explains the whole process of exploitation with the help of his theory of", o: ["Dialectical Materialism", "Surplus Value", "Historical Materialism", "None of these"], a: "b" },
            { q: "Who expounded the thesis that capitalism contains its own seeds of destruction?", o: ["Marx", "Plato", "Hobbes", "Rousseau"], a: "a" },
            { q: "Lenin's major work 'State and Revolution' was written in", o: ["1900", "1914", "1917", "1947"], a: "c" },
            { q: "Who made the statement that as soon as communism is established, the state becomes unnecessary?", o: ["Mao", "Lenin", "Plato", "None of these"], a: "b" },
            { q: "Name the leader who made a distinction between organization of workers and organization of revolutionaries.", o: ["Mao", "Gramsui", "Lenin", "Plato"], a: "c" },
            { q: "Which political leadership now describes the cultural revolution as nothing less than a calamity for their country;", o: ["Present Communist leadership in China", "Mao", "American", "Russian"], a: "a" }
        ];

        let currentQuestionIndex = 0;
        let correctAnswers = 0;

        const questionCounterEl = document.getElementById('question-counter');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        const optionButtons = document.querySelectorAll('.option-btn');
        const feedbackTextEl = document.getElementById('feedback-text');
        const nextBtnEl = document.getElementById('next-btn');
        const progressBarEl = document.getElementById('progress-bar');

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                showResults();
                return;
            }

            // Reset UI
            feedbackTextEl.textContent = '';
            nextBtnEl.style.visibility = 'hidden';
            optionButtons.forEach(btn => {
                btn.disabled = false;
                btn.classList.remove('correct', 'incorrect');
            });

            // Load new question
            const q = questions[currentQuestionIndex];
            questionTextEl.textContent = q.q;
            questionCounterEl.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            
            // Update progress bar
            progressBarEl.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

            // Load options
            optionButtons.forEach((btn, index) => {
                const optionLetter = btn.getAttribute('data-option');
                btn.textContent = `${optionLetter.toUpperCase()}. ${q.o[index]}`;
            });
        }

        function handleOptionClick(event) {
            const selectedBtn = event.target;
            const selectedOption = selectedBtn.getAttribute('data-option');
            const correctAnswer = questions[currentQuestionIndex].a;

            // Disable all buttons
            optionButtons.forEach(btn => btn.disabled = true);

            // Show feedback
            if (selectedOption === correctAnswer) {
                selectedBtn.classList.add('correct');
                feedbackTextEl.textContent = 'Correct!';
                feedbackTextEl.style.color = '#2f855a';
                correctAnswers++;
            } else {
                selectedBtn.classList.add('incorrect');
                feedbackTextEl.textContent = 'Incorrect!';
                feedbackTextEl.style.color = '#c53030';
                // Highlight the correct answer
                const correctBtn = document.querySelector(`.option-btn[data-option="${correctAnswer}"]`);
                correctBtn.classList.add('correct');
            }

            // Show 'Next' button
            nextBtnEl.style.visibility = 'visible';
        }

        function showResults() {
            document.getElementById('question-area').innerHTML = `
                <h2 style="font-size: 24px; text-align: center;">Quiz Complete!</h2>
                <p style="font-size: 18px; text-align: center; margin-top: 20px;">
                    You scored ${correctAnswers} out of ${questions.length}
                </p>
                <button id="restart-btn" style="background-color: #4299e1; color: white; border: none; border-radius: 8px; padding: 14px 28px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background-color 0.2s ease; display: block; width: 200px; margin: 30px auto 0;">
                    Restart Quiz
                </button>
            `;
            document.getElementById('feedback-area').style.display = 'none';
            questionCounterEl.textContent = 'Quiz Finished';
            
            document.getElementById('restart-btn').addEventListener('click', () => {
                location.reload(); // Simple way to restart
            });
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        // Event Listeners
        optionButtons.forEach(btn => {
            btn.addEventListener('click', handleOptionClick);
        });
        nextBtnEl.addEventListener('click', nextQuestion);

        // Initial load
        loadQuestion();
    </script>

</body>
</html>
